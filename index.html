<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="Asekles.png" type="image/png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #f1f1f1;
    }

    header {
      background: linear-gradient(45deg, #ff0066, #6600ff);
      padding: 10px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      background: #111;
      padding: 10px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #ff0066;
    }

    .content {
      padding: 20px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .movie-item {
      background: #222;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .movie-item img {
      width: 100%;
      border-radius: 10px;
    }

    .movie-item h3 {
      color: #ff0066;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>

<body>

<header>
  <h1>ⵣ Asekles - ⴰⵙⴻⴽⵍⴻⵙ ⵣ</h1>

<nav>
  <a href="index.html">Axxam</a>

  <a href="tizrarin.html">Tizrarin</a>
  <a href="javascript:void(0)" id="amidanBtn" style="display:none;">Amiḍan</a>
</nav>

<div class="content">

  <div class="movie-grid">
    <!-- films inchangés -->
    <!-- exactement comme tu les as -->
  </div>
</div>

<footer>
  &copy; 2026 Asekles
</footer>

<!-- ===== AMIDAN ===== -->
<div id="accountBox" style="
display:none;
position:fixed;
top:60px;
right:20px;
background:#111;
border:2px solid #ff0066;
padding:15px;
border-radius:10px;
z-index:999;
">
  <p id="userEmail"></p>
  <button id="logoutBtn"
    style="background:#ff0066;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;">
    Se déconnecter
  </button>
</div>

<!-- ===== FIREBASE AUTH ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged, 
  signOut 
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

/* 🔥 CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
  authDomain: "test-2fdd3.firebaseapp.com",
  projectId: "test-2fdd3",
  appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 🎯 ELEMENTS */
const amidanBtn = document.getElementById("amidanBtn");
const accountBox = document.getElementById("accountBox");
const userEmail = document.getElementById("userEmail");
const logoutBtn = document.getElementById("logoutBtn");

/* 🔐 PROTECTION TOTALE */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    // ❌ PAS CONNECTÉ
    window.location.replace("login.html");
  } else {
    // ✅ CONNECTÉ
    amidanBtn.style.display = "inline";
    userEmail.textContent = "Connecté : " + user.email;
  }
});

/* 👤 TOGGLE AMIDAN */
amidanBtn.addEventListener("click", () => {
  accountBox.style.display =
    accountBox.style.display === "block" ? "none" : "block";
});

/* 🚪 LOGOUT */
logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  window.location.replace("login.html");
});
</script>

</body>
</html>
