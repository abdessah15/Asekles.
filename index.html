<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>ⵣ Asekles - ⴰⵙⴻⴽⵍⴻⵙ ⵣ</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #000;
  color: #f1f1f1;
}

/* ===== LOADER ===== */
#loader {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #333;
  border-top: 4px solid #ff0066;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 15px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== HEADER ===== */
header {
  background: linear-gradient(45deg, #ff0066, #6600ff);
  padding: 10px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 2em;
}

/* ===== NAV ===== */
nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 10px;
  background: #111;
  flex-wrap: wrap;
}

nav a,
#amidanBtn {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  cursor: pointer;
}

nav a:hover,
#amidanBtn:hover {
  color: #ff0066;
}

/* ===== AMIDAN ===== */
.account-wrapper {
  position: relative;
}

#accountBox {
  display: none;
  position: absolute;
  top: 32px;
  right: 0;
  background: #111;
  border: 2px solid #ff0066;
  padding: 15px;
  border-radius: 10px;
  min-width: 220px;
  z-index: 999;
}

#logoutBtn {
  background: #ff0066;
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
}

/* ===== CONTENT ===== */
.content {
  padding: 20px;
  padding-bottom: 120px;
}

.movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.movie-item {
  background: #222;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.movie-item img {
  width: 100%;
  border-radius: 10px;
}

.movie-item h3 {
  margin-top: 10px;
  font-size: 1.2em;
  color: #ff0066;
}

a {
  text-decoration: none;
  color: inherit;
}

/* ===== FOOTER ===== */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #111;
  text-align: center;
  padding: 8px;
  font-size: .9em;
}
</style>
</head>

<body>

<!-- 🔄 LOADER -->
<div id="loader">
  <div class="spinner"></div>
  <p>Asenqed n tsarut…</p>
</div>

<!-- 🔒 CONTENU PROTÉGÉ -->
<div id="protectedContent" style="display:none;">

<header>
  <h1>ⵣ Asekles - ⴰⵙⴻⴽⵍⴻⵙ ⵣ</h1>
</header>

<nav>
  <a href="index.html">Axxam</a>
  <a href="isura.html">Isura</a>
  <a href="tizrarin.html">Tizrarin</a>

  <div class="account-wrapper">
    <span id="amidanBtn" style="display:none;">Amiḍan</span>
    <div id="accountBox">
      <p id="userEmail"></p>
      <button id="logoutBtn">Effeɣ</button>
    </div>
  </div>
</nav>

<div class="content">
  <h2>I kunwi d kunemti</h2>
  <div class="movie-grid">

    <!-- (tes films inchangés) -->
    <!-- Tu n’as RIEN à modifier ici -->

  </div>
</div>

<footer>
  © Asekles
</footer>

</div>

<!-- 🔥 FIREBASE TV COMPAT -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
    authDomain: "test-2fdd3.firebaseapp.com",
    projectId: "test-2fdd3",
    appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c"
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();

  var loader = document.getElementById("loader");
  var content = document.getElementById("protectedContent");
  var amidanBtn = document.getElementById("amidanBtn");
  var accountBox = document.getElementById("accountBox");
  var userEmail = document.getElementById("userEmail");
  var logoutBtn = document.getElementById("logoutBtn");

  auth.onAuthStateChanged(function(user) {
    if (!user) {
      window.location.replace("login.html");
    } else {
      loader.style.display = "none";
      content.style.display = "block";
      amidanBtn.style.display = "inline";
      userEmail.textContent = user.email;
    }
  });

  amidanBtn.onclick = function (e) {
    e.stopPropagation();
    accountBox.style.display =
      accountBox.style.display === "block" ? "none" : "block";
  };

  logoutBtn.onclick = function () {
    auth.signOut().then(function () {
      window.location.replace("login.html");
    });
  };

  document.onclick = function () {
    accountBox.style.display = "none";
  };
</script>

</body>
</html>
