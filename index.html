<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asekles - Tamacahut N Wakli</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:#000;
  color:#f1f1f1;
}

header {
  background: linear-gradient(45deg, #ff0066, #6600ff);
  padding: 15px;
  text-align: center;
}

nav {
  display:flex;
  justify-content:center;
  gap:20px;
  background:#111;
  padding:10px;
}

nav a {
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
}

nav a:hover { color:#ff0066 }

.container {
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:25px;
}

#accountBox {
  display:none;
  background:#111;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

#logoutBtn {
  margin-top:10px;
  padding:8px 15px;
  border:none;
  background:#ff0066;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}

.video-container {
  max-width:900px;
  width:100%;
}

.video-thumb {
  width:100%;
  aspect-ratio:16/9;
  background:url("3.png") center/cover no-repeat;
  cursor:pointer;
  position:relative;
}

.play-btn {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:80px;
  height:80px;
  background:rgba(0,0,0,.6);
  border-radius:50%;
}

.play-btn::before {
  content:"";
  border-style:solid;
  border-width:16px 0 16px 26px;
  border-color:transparent transparent transparent #ff0066;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-40%,-50%);
}

#player { display:none }
</style>
</head>

<body>

<header>
<h1>Berhuc d Salas</h1>
</header>

<nav>
<a href="index.html">Axxam</a>
<a href="isura.html">Isura</a>
<a href="tizrarin.html">Tizrarin</a>
<a id="amidanBtn" style="display:none;">Amiḍan</a>
</nav>

<div class="container">

<!-- ===== AMIDAN ===== -->
<div id="accountBox">
  <p id="userEmail"></p>
  <button id="logoutBtn">Se déconnecter</button>
</div>

<!-- ===== VIDEO ===== -->
<div class="video-container">
  <div class="video-thumb" id="thumb">
    <div class="play-btn"></div>
  </div>
  <div id="player"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
  authDomain: "test-2fdd3.firebaseapp.com",
  projectId: "test-2fdd3",
  appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 🎯 ELEMENTS */
const amidanBtn = document.getElementById("amidanBtn");
const accountBox = document.getElementById("accountBox");
const userEmail = document.getElementById("userEmail");
const logoutBtn = document.getElementById("logoutBtn");
const thumb = document.getElementById("thumb");
const playerBox = document.getElementById("player");

/* 🔐 PROTECTION PAGE */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    amidanBtn.style.display = "inline";
    userEmail.innerText = "Connecté : " + user.email;
  }
});

/* 👤 AMIDAN */
amidanBtn.onclick = () => {
  accountBox.style.display =
    accountBox.style.display === "block" ? "none" : "block";
};

/* 🚪 LOGOUT */
logoutBtn.onclick = async () => {
  await signOut(auth);
  window.location.href = "login.html";
};

/* ▶️ PLAYER */
thumb.onclick = () => {
  thumb.style.display = "none";
  playerBox.style.display = "block";

  new Artplayer({
    container: playerBox,
    url: "https://player.odycdn.com/api/v3/streams/free/tamacahut-n-wakli/3307cb145aaf559b7333b542743e72991dc46c5e/1e550e.mp4",
    autoplay:true,
    theme:"#ff0066"
  });
};
</script>

</body>
</html>
