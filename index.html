<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asekles - Berhuc d Salas</title>
<link rel="icon" href="Asekles.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.css">

<style>
body { margin:0; font-family:Arial,sans-serif; background:#000; color:#f1f1f1; }
header { background: linear-gradient(45deg,#ff0066,#6600ff); padding:15px; text-align:center;}
nav { display:flex; justify-content:center; padding:10px; background:#111; gap:20px;}
nav a { color:#fff; text-decoration:none; font-weight:bold;}
.container { display:flex; flex-direction:column; align-items:center; gap:25px; padding:20px;}
#authBox { text-align:center; margin-bottom:20px;}
#authBox input { padding:8px; width:250px; border-radius:5px; border:none; margin:5px;}
#authBox button { padding:10px 15px; margin:5px; border-radius:6px; border:none; cursor:pointer;}
#loginBtn { background:#4285F4; color:white;}
#logoutBtn { background:#555; color:white; display:none;}
#subscribeBox a { background:#25D366; color:white; padding:10px 15px; border-radius:8px; text-decoration:none; display:inline-block; margin-top:10px;}
.video-container { width:100%; max-width:900px; background:#000; border-radius:12px; overflow:hidden;}
.video-thumb { width:100%; aspect-ratio:16/9; background:url("3.png") center/cover no-repeat; cursor:pointer; position:relative; display:none;}
.play-btn { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:90px; height:90px; background: rgba(0,0,0,0.6); border-radius:50%;}
.artplayer-app { width:100%; aspect-ratio:16/9; display:none;}
</style>
</head>

<body>
<header>
<h1>Berhuc d Salas</h1>
</header>

<nav>
<a href="index.html">Axxam</a>
<a href="isura.html">Isura</a>
<a href="tizrarin.html">Tizrarin</a>
</nav>

<div class="container">

<!-- LOGIN PAR EMAIL -->
<div id="authBox">
  <p id="authStatus">🔒 Entrez votre email pour accéder</p>
  <input type="email" id="emailInput" placeholder="Votre email">
  <button id="loginBtn">Se connecter</button>
  <button id="logoutBtn">Se déconnecter</button>

  <div id="subscribeBox" style="display:none;">
    <p>💳 Abonnement : <strong>200 DA / mois</strong></p>
    <a id="whatsappBtn" target="_blank">📲 S’abonner via WhatsApp</a>
  </div>
</div>

<!-- VIDEO -->
<div class="video-container">
  <div class="video-thumb" id="thumb">
    <div class="play-btn"></div>
  </div>
  <div class="artplayer-app" id="player"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
  authDomain: "test-2fdd3.firebaseapp.com",
  projectId: "test-2fdd3",
  appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ELEMENTS */
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const emailInput = document.getElementById("emailInput");
const authStatus = document.getElementById("authStatus");
const subscribeBox = document.getElementById("subscribeBox");
const whatsappBtn = document.getElementById("whatsappBtn");
const thumb = document.getElementById("thumb");

let currentUser = null;

/* FONCTION DE VERIFICATION FIRESTORE */
async function checkSubscription(email){
  const ref = doc(db, "subscriptions", email);
  const snap = await getDoc(ref);
  if(!snap.exists()) return false;
  const data = snap.data();
  if(!data.active) return false;
  const now = new Date();
  const expires = data.expiresAt.toDate();
  return expires > now;
}

/* LOGIN PAR EMAIL */
loginBtn.onclick = async () => {
  const email = emailInput.value.trim().toLowerCase();
  if(!email) return alert("Veuillez entrer votre email");
  currentUser = email;

  const isActive = await checkSubscription(email);

  if(isActive){
    authStatus.innerText = "Connecté : " + email;
    thumb.style.display = "block";
    subscribeBox.style.display = "none";
  } else {
    authStatus.innerText = "🔒 Abonnement requis";
    thumb.style.display = "none";
    subscribeBox.style.display = "block";
    const msg = `Bonjour, je veux m'abonner pour 200 DA. Mon email : ${email}`;
    whatsappBtn.href = "https://wa.me/2136XXXXXXX?text=" + encodeURIComponent(msg);
  }

  loginBtn.style.display = "none";
  logoutBtn.style.display = "inline";
  emailInput.style.display = "none";
};

/* LOGOUT */
logoutBtn.onclick = () => {
  currentUser = null;
  authStatus.innerText = "🔒 Entrez votre email pour accéder";
  loginBtn.style.display = "inline";
  logoutBtn.style.display = "none";
  emailInput.style.display = "inline";
  emailInput.value = "";
  thumb.style.display = "none";
  subscribeBox.style.display = "none";
};

/* VIDEO PLAYER */
const playerBox = document.getElementById("player");
thumb.onclick = () => {
  thumb.style.display = "none";
  playerBox.style.display = "block";

  new Artplayer({
    container: playerBox,
    url: "https://player.odycdn.com/api/v3/streams/free/Berhuc-d-Salas/49982ca9dd551d7b0df506ad31aea175559fd1d7/1400aa.mp4",
    autoplay: true,
    theme: "#ff0066"
  });
};
</script>
</body>
</html>
