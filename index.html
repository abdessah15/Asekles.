<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asekles - Berhuc d Salas</title>
<link rel="icon" href="Asekles.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.css">

<style>
body{margin:0;font-family:Arial;background:#000;color:#f1f1f1}
header{background:linear-gradient(45deg,#ff0066,#6600ff);padding:15px;text-align:center}
nav{display:flex;justify-content:center;gap:20px;padding:10px;background:#111}
nav a,#amidanBtn{color:#fff;text-decoration:none;font-weight:bold;cursor:pointer}
nav a:hover,#amidanBtn:hover{color:#ff0066}

.account-wrapper{position:relative}
#accountBox{
display:none;
position:absolute;
top:32px;
right:0;
background:#111;
border:2px solid #ff0066;
padding:15px;
border-radius:10px;
min-width:240px;
z-index:999
}
#accountBox p{margin:6px 0}
#logoutBtn{
background:#ff0066;
color:#fff;
border:none;
padding:8px;
border-radius:6px;
cursor:pointer;
width:100%
}
</style>
</head>

<body>

<header>
<h1>Berhuc d Salas - ⴱⴻⵔⵀⵓⵛ ⴷ ⵙⴰⵍⴰⵙ</h1>
</header>

<nav>
<a href="index.html">Axxam</a>
<a href="isura.html">Isura</a>
<a href="tizrarin.html">Tizrarin</a>

<div class="account-wrapper">
<span id="amidanBtn" style="display:none;">Amiḍan</span>

<div id="accountBox">
<p id="userEmail"></p>
<p id="userExpire"></p>
<button id="logoutBtn">Effeɣ</button>
</div>
</div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
  authDomain: "test-2fdd3.firebaseapp.com",
  projectId: "test-2fdd3",
  appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c",
  databaseURL: "https://test-2fdd3-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* ELEMENTS */
const amidanBtn = document.getElementById("amidanBtn");
const accountBox = document.getElementById("accountBox");
const userEmail = document.getElementById("userEmail");
const userExpire = document.getElementById("userExpire");
const logoutBtn = document.getElementById("logoutBtn");

/* AUTH CHECK */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  amidanBtn.style.display = "inline";

  const snap = await get(ref(db, "users/" + user.uid));
  if (snap.exists()) {
    const data = snap.val();
    userEmail.textContent = "isem n umiḍan : " + data.email;
    userExpire.textContent = "azemz n tagara : " + data.expiresAt;
  } else {
    userEmail.textContent = "isem n umiḍan : " + user.email;
    userExpire.textContent = "azemz n tagara : ur yella ara";
  }
});

/* TOGGLE AMIDAN */
amidanBtn.addEventListener("click", () => {
  accountBox.style.display =
    accountBox.style.display === "block" ? "none" : "block";
});

/* LOGOUT */
logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "login.html";
});

/* CLOSE OUTSIDE */
document.addEventListener("click", (e) => {
  if (!amidanBtn.contains(e.target) && !accountBox.contains(e.target)) {
    accountBox.style.display = "none";
  }
});
</script>

</body>
</html>
