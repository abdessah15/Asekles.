<div id="accountBox" style="
display:none;
position:fixed;
top:60px;

">
  <p id="userEmail"></p>
  <button id="logoutBtn"

    Se déconnecter
  </button>
</div>

<!-- ===== FIREBASE ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
  authDomain: "test-2fdd3.firebaseapp.com",
  projectId: "test-2fdd3",
  appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const amidanBtn = document.getElementById("amidanBtn");
const accountBox = document.getElementById("accountBox");
const userEmail = document.getElementById("userEmail");
const logoutBtn = document.getElementById("logoutBtn");

/* 🔐 PROTECTION */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    amidanBtn.style.display = "inline";
    userEmail.innerText = "Connecté : " + user.email;
  }
});

/* 👤 AMIDAN */
amidanBtn.onclick = () => {
  accountBox.style.display =
    accountBox.style.display === "block" ? "none" : "block";
};

/* 🚪 LOGOUT */
logoutBtn.onclick = async () => {
  await signOut(auth);
  window.location.href = "login.html";
};
</script>
