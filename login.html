<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<!-- 📱 ESSENTIEL POUR MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Connexion – Asekles</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  padding:15px;
}

.box {
  background:#111;
  padding:25px;
  border-radius:14px;
  width:100%;
  max-width:360px;
  text-align:center;
}

h2 {
  margin-top:0;
  margin-bottom:15px;
}

/* 🔐 INPUTS */
input {
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
  font-size:16px; /* 🚨 empêche le zoom */
}

/* 🔘 BOUTONS */
button {
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

#loginBtn {
  background:#ff0066;
  color:white;
}

#whatsappBtn {
  background:#25D366;
  color:white;
}

#error {
  color:#ff5555;
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="box">
  <h2>Kcem s tsarut</h2>

  <button id="whatsappBtn">Aɣɣ-d aferwak</button>

  <hr style="margin:18px 0; border-color:#333;">

  <input id="email" type="email" placeholder="Isem n umiḍan">
  <input id="password" type="password" placeholder="Tasarut">

  <button id="loginBtn">Kcem</button>

  <p id="error"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAX7amyQdzfssmwjIaaFl1qn0Ts5af1DCM",
  authDomain: "test-2fdd3.firebaseapp.com",
  projectId: "test-2fdd3",
  appId: "1:244317844373:web:3a4e5b77c649f54d7fbc9c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 📲 WHATSAPP */
whatsappBtn.onclick = () => {
  const msg = "Bonjour, je souhaite acheter un abonnement Asekles (200 DA / mois).";
  window.open(
    "https://wa.me/213549717754?text=" + encodeURIComponent(msg),
    "_blank"
  );
};

/* 🔑 LOGIN */
loginBtn.onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
    window.location.href = "index.html";
  } catch {
    error.innerText = "Tuccḍa deg tsarut !";
  }
};
</script>

</body>
</html>
