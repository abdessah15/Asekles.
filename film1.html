<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #f1f1f1;
}

header {
  background: linear-gradient(45deg, #ff0066, #6600ff);
  padding: 10px;
  text-align: center;
}

nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  background: #111;
  padding: 10px;
  position: relative;
}

nav a {
  color: #fff;
  text-decoration: none;
  font-weight: bold;
}

nav a:hover {
  color: #ff0066;
}

.content {
  padding: 20px;
  padding-bottom: 120px;
}

.movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.movie-item {
  background: #222;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.movie-item img {
  width: 100%;
  border-radius: 10px;
}

.movie-item h3 {
  color: #ff0066;
}

footer {
  background: #111;
  color: #aaa;
  text-align: center;
  padding: 10px;
  position: fixed;
  bottom: 0;
  width: 100%;
}

/* ===== BOÎTE AMIDAN ===== */
#accountBox {
  display: none;
  position: absolute;
  top: 55px;
  right: 20px;
  background: #111;
  border: 2px solid #ff0066;
  padding: 15px;
  border-radius: 10px;
  z-index: 1000;
}

#accountBox p {
  margin: 0 0 10px;
}

#accountBox button {
  background: #ff0066;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
